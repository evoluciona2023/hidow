<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HiDow Agent — Analytics</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f2f5;color:#1a1a2e;padding:24px}
    h1{font-size:22px;margin-bottom:4px}
    .subtitle{color:#888;font-size:13px;margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .card{background:white;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .card-value{font-size:32px;font-weight:700;color:#2563eb;margin-bottom:4px}
    .card-label{font-size:13px;color:#666}
    .section{background:white;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px}
    h2{font-size:16px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #f0f2f5}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:8px 12px;color:#666;font-weight:600;border-bottom:1px solid #eee}
    td{padding:8px 12px;border-bottom:1px solid #f5f5f5}
    tr:last-child td{border-bottom:none}
    .bar{height:20px;background:#2563eb;border-radius:4px;transition:width .5s}
    .bar-wrap{background:#f0f2f5;border-radius:4px;overflow:hidden;flex:1}
    .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .bar-label{font-size:13px;width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-count{font-size:13px;color:#666;width:30px;text-align:right}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
    .badge-web{background:#dbeafe;color:#1d4ed8}
    .badge-tg{background:#d1fae5;color:#065f46}
    .event-row td:first-child{color:#888;font-size:11px;font-family:monospace}
    .refresh-btn{background:#2563eb;color:white;border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;margin-bottom:20px}
    .empty{color:#888;font-size:13px;padding:20px 0;text-align:center}
    .lang-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin-top:8px}
    .lang-en{background:#2563eb;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600}
    .lang-es{background:#7c3aed;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600}
  </style>
</head>
<body>
  <h1>📊 HiDow Agent Analytics</h1>
  <p class="subtitle">Live data from the agent — auto-refresh every 30s</p>
  <button class="refresh-btn" onclick="load()">↻ Refresh</button>

  <div class="grid" id="kpis"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="section">
      <h2>🏆 Top Products Asked</h2>
      <div id="top-products"></div>
    </div>
    <div class="section">
      <h2>🌐 Channel & Language Split</h2>
      <div id="channels"></div>
    </div>
  </div>

  <div class="section" style="margin-top:16px">
    <h2>📅 Activity by Day</h2>
    <div id="by-day"></div>
  </div>

  <div class="section" style="margin-top:16px">
    <h2>🕐 Recent Events</h2>
    <table>
      <thead><tr><th>Time</th><th>Event</th><th>Session</th><th>Detail</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </div>

<script>
  const API = "http://localhost:3001/api/analytics";

  const EVENT_LABELS = {
    message_sent: "💬 Message",
    order_completed: "✅ Order",
    handoff_requested: "🙋 Handoff",
    product_mentioned: "📦 Product",
    conversation_started: "🆕 New conv.",
    error: "❌ Error",
  };

  async function load() {
    try {
      const res = await fetch(API);
      const { summary, recentEvents } = await res.json();
      renderKPIs(summary);
      renderTopProducts(summary.top_products);
      renderChannels(summary);
      renderByDay(summary.by_day);
      renderEvents(recentEvents);
    } catch {
      document.getElementById("kpis").innerHTML = '<p style="color:red">Cannot reach server at localhost:3001</p>';
    }
  }

  function renderKPIs(s) {
    document.getElementById("kpis").innerHTML = `
      <div class="card"><div class="card-value">${s.total_conversations}</div><div class="card-label">Total conversations</div></div>
      <div class="card"><div class="card-value">${s.total_messages}</div><div class="card-label">Total messages</div></div>
      <div class="card"><div class="card-value" style="color:#16a34a">${s.orders_completed}</div><div class="card-label">Orders completed</div></div>
      <div class="card"><div class="card-value" style="color:#dc2626">${s.handoffs_requested}</div><div class="card-label">Handoffs to human</div></div>
      <div class="card">
        <div class="card-value" style="font-size:20px">
          ${s.total_conversations > 0 ? ((s.orders_completed / s.total_conversations) * 100).toFixed(1) : 0}%
        </div>
        <div class="card-label">Conversion rate</div>
      </div>
    `;
  }

  function renderTopProducts(products) {
    const el = document.getElementById("top-products");
    if (!products.length) { el.innerHTML = '<p class="empty">No data yet</p>'; return; }
    const max = products[0].count;
    el.innerHTML = products.map(p => `
      <div class="bar-row">
        <span class="bar-label" title="${p.name}">${p.name}</span>
        <div class="bar-wrap"><div class="bar" style="width:${(p.count/max*100).toFixed(0)}%"></div></div>
        <span class="bar-count">${p.count}</span>
      </div>
    `).join("");
  }

  function renderChannels(s) {
    const el = document.getElementById("channels");
    const totalCh = (s.channel.web || 0) + (s.channel.telegram || 0);
    const totalLang = (s.language.en || 0) + (s.language.es || 0);
    const enPct = totalLang ? ((s.language.en / totalLang) * 100).toFixed(0) : 50;
    const esPct = 100 - enPct;
    el.innerHTML = `
      <table style="margin-bottom:16px">
        <tr><td>🌐 Web</td><td><span class="badge badge-web">${s.channel.web || 0} msgs</span></td></tr>
        <tr><td>✈️ Telegram</td><td><span class="badge badge-tg">${s.channel.telegram || 0} msgs</span></td></tr>
      </table>
      <div style="font-size:13px;margin-bottom:6px;color:#666">Language split (${totalLang} msgs)</div>
      <div class="lang-bar">
        <div class="lang-en" style="width:${enPct}%">${enPct}% EN</div>
        <div class="lang-es" style="width:${esPct}%">${esPct}% ES</div>
      </div>
    `;
  }

  function renderByDay(byDay) {
    const el = document.getElementById("by-day");
    const entries = Object.entries(byDay).sort();
    if (!entries.length) { el.innerHTML = '<p class="empty">No data yet</p>'; return; }
    const max = Math.max(...entries.map(e => e[1]));
    el.innerHTML = entries.slice(-14).map(([day, count]) => `
      <div class="bar-row">
        <span class="bar-label">${day}</span>
        <div class="bar-wrap"><div class="bar" style="width:${(count/max*100).toFixed(0)}%;background:#7c3aed"></div></div>
        <span class="bar-count">${count}</span>
      </div>
    `).join("");
  }

  function renderEvents(events) {
    const tbody = document.getElementById("events");
    if (!events.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">No events yet</td></tr>'; return; }
    tbody.innerHTML = events.slice(0, 30).map(e => `
      <tr class="event-row">
        <td>${e.timestamp.replace("T"," ").slice(0,19)}</td>
        <td>${EVENT_LABELS[e.event] || e.event}</td>
        <td>${(e.sessionId || "").slice(0,8)}…</td>
        <td>${e.product || e.language || e.channel || e.reason || ""}</td>
      </tr>
    `).join("");
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
